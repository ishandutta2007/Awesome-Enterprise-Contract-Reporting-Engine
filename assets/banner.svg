<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="400" style="background: linear-gradient(135deg, #0b0f19 0%, #111827 50%, #1e1b4b 100%); border-radius: 16px; overflow: hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="bar-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #334155; stroke-opacity: 0.25; stroke-width: 1; }
    .pulse-glow { animation: pulse 4s ease-in-out infinite alternate; }
    .float-card { animation: floatSlow 6s ease-in-out infinite alternate; }
    .shimmer-pill { animation: shimmer 5s ease-in-out infinite; }
    .data-stream { stroke-dasharray: 8 6; animation: dash 20s linear infinite; }

    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.7; transform: scale(1.02); }
    }
    @keyframes floatSlow {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }
    @keyframes shimmer {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.6)); }
    }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 16px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      fill: #38bdf8;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>

  <!-- Background Grid -->
  <g class="grid-line">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="180" cy="120" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)" class="pulse-glow" />
  <circle cx="980" cy="220" r="180" fill="#0284c7" opacity="0.15" filter="url(#glow)" class="pulse-glow" />

  <!-- Animated Data Connection Lines (Background) -->
  <path d="M 650 310 Q 780 200 900 240 T 1140 180" fill="none" stroke="url(#line-grad)" stroke-width="2.5" opacity="0.6" class="data-stream" />
  <path d="M 680 340 Q 820 280 940 310 T 1160 250" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.35" class="data-stream" />

  <!-- Dynamic Analytics Floating Card (Right Background/Midground) -->
  <g class="float-card" transform="translate(740, 75)">
    <rect width="400" height="250" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.5))" />
    
    <!-- Mini Window Header -->
    <rect x="18" y="18" width="8" height="8" rx="4" fill="#f43f5e" opacity="0.8" />
    <rect x="32" y="18" width="8" height="8" rx="4" fill="#eab308" opacity="0.8" />
    <rect x="46" y="18" width="8" height="8" rx="4" fill="#10b981" opacity="0.8" />
    <text x="68" y="26" fill="#64748b" font-family="monospace" font-size="11">CONTRACT_ANALYTICS_V3.ENGINE</text>

    <!-- Mini KPI Stat Badges -->
    <g transform="translate(20, 45)">
      <rect width="110" height="44" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="10" y="18" fill="#94a3b8" font-family="sans-serif" font-size="10">ACTIVE CONTRACTS</text>
      <text x="10" y="36" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="15">14,280</text>
    </g>
    <g transform="translate(142, 45)">
      <rect width="110" height="44" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="10" y="18" fill="#94a3b8" font-family="sans-serif" font-size="10">OBLIGATION SLA</text>
      <text x="10" y="36" fill="#10b981" font-family="sans-serif" font-weight="bold" font-size="15">99.4%</text>
    </g>
    <g transform="translate(264, 45)">
      <rect width="116" height="44" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="10" y="18" fill="#94a3b8" font-family="sans-serif" font-size="10">TOTAL ACV AUDITED</text>
      <text x="10" y="36" fill="#c084fc" font-family="sans-serif" font-weight="bold" font-size="15">$1.84B</text>
    </g>

    <!-- Analytical Chart Bars -->
    <g transform="translate(20, 115)">
      <line x1="0" y1="105" x2="360" y2="105" stroke="#334155" stroke-width="1" />
      
      <!-- Bars with varied heights -->
      <rect x="15" y="45" width="20" height="60" rx="4" fill="url(#bar-grad)" />
      <rect x="55" y="25" width="20" height="80" rx="4" fill="url(#bar-grad)" />
      <rect x="95" y="55" width="20" height="50" rx="4" fill="url(#bar-grad)" />
      <rect x="135" y="15" width="20" height="90" rx="4" fill="url(#bar-grad)" />
      <rect x="175" y="35" width="20" height="70" rx="4" fill="url(#bar-grad)" />
      <rect x="215" y="10" width="20" height="95" rx="4" fill="url(#bar-grad)" />
      <rect x="255" y="40" width="20" height="65" rx="4" fill="url(#bar-grad)" />
      <rect x="295" y="20" width="20" height="85" rx="4" fill="url(#bar-grad)" />
      <rect x="335" y="30" width="20" height="75" rx="4" fill="url(#bar-grad)" />

      <!-- Sparkline over bars -->
      <polyline points="25,40 65,20 105,50 145,10 185,30 225,5 265,35 305,15 345,25" fill="none" stroke="#38bdf8" stroke-width="2.5" filter="drop-shadow(0 2px 4px rgba(56,189,248,0.5))" />
      <circle cx="225" cy="5" r="4" fill="#ffffff" stroke="#38bdf8" stroke-width="2" />
    </g>
  </g>

  <!-- Foreground Title and Branding Area (Clear, Unobstructed, High-Contrast) -->
  <g transform="translate(60, 60)">
    
    <!-- Category Pill -->
    <g class="shimmer-pill">
      <rect x="0" y="0" width="290" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#38bdf8" />
      <text x="26" y="18" class="badge-label">ENTERPRISE LEGALTECH &amp; BI STACK</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="78" class="title-text">
      Enterprise Contract
    </text>
    <text x="0" y="126" class="title-text" fill="url(#accent-grad)">
      Reporting Engine
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="172" class="subtitle-text">
      Curated directory of contract analytics platforms, obligation reporting,
    </text>
    <text x="0" y="196" class="subtitle-text">
      spend leakage intelligence &amp; self-hosted open-source BI engines.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 230)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="145" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.6" stroke-width="1" />
      <text x="16" y="20" fill="#c7d2fe" font-family="sans-serif" font-size="12" font-weight="600">📊 SaaS &amp; BI Platforms</text>

      <!-- Pill 2 -->
      <rect x="155" y="0" width="155" height="32" rx="16" fill="#082f49" stroke="#0284c7" stroke-opacity="0.6" stroke-width="1" />
      <text x="171" y="20" fill="#bae6fd" font-family="sans-serif" font-size="12" font-weight="600">⚡ Open-Source Stack</text>

      <!-- Pill 3 -->
      <rect x="320" y="0" width="160" height="32" rx="16" fill="#1f2937" stroke="#10b981" stroke-opacity="0.6" stroke-width="1" />
      <text x="336" y="20" fill="#a7f3d0" font-family="sans-serif" font-size="12" font-weight="600">🛡️ Obligation Auditing</text>
    </g>
  </g>
</svg>